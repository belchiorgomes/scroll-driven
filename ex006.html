<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  height: 200vh;
  display: flex;
  flex-direction: column;
  gap: 100px;
  padding-top: 100px;
}

.box {
  width: 200px;
  height: 100px;
  background: royalblue;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;

  /* Estado inicial */
  opacity: 0;
  transform: translateY(50px);

  /* Animação */
  animation: aparecer linear forwards;
  animation-timeline: view();
  animation-range: entry 0% cover 40%;
}

@keyframes aparecer {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    </style>
</head>
<body>
    <section class="box">Elemento 1</section>
<section class="box">Elemento 2</section>
<section class="box">Elemento 3</section>


</body>
</html>
