<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemento aparecendo suavemente ao entrar na tela (só CSS)</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      height: 300vh;
      display: grid;
      place-content: center;
    }

    .card{
      block-size: 200px;
      inline-size: 400px;
      border-radius: .6rem;
      background-color: coral;

      transform: scale(0);

      view-timeline-name: --card;
      view-timeline-axis: block;

      animation-name: aparencer;
      animation-timeline: --card;

      /* controla quando começa e termina */
      animation-range: entry 0% cover 40%;
      animation-fill-mode: both;
    }

    @keyframes aparencer{
      from{
        opacity: 0;
        transform: translateY(800px) scale(0);
      }
      to{
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="card"></div>
</body>
</html>
