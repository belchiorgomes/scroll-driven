<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 200vh;
        }

        i{
            font-size: 1.3rem;
        }

        nav{
            position: fixed;
            top: 0;
            z-index: 999;
            width: 100%;
            background-color: black;
            color: white;
            animation: colorBar linear;
            animation-timeline: scroll();
            animation-range: 200px;

            .nav-container{
                width: 90%;
                height: 60px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;

                ul{
                    list-style-type: none;
                    display: flex;
                    gap: 1.6rem;

                    li a{
                        display: block;
                        color: white;
                    }
                }
            }
        }

        @keyframes colorBar{
            from{
                background-color: black;
            }
            to{
                background-color: white;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <span class="icon"><i class="fa-brands fa-apple"></i></span>
            </div>
            <ul>
                <li>
                    <a href="#"><i class="fa-solid fa-house"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-video"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-photo-film"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-user-group"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fa-solid fa-envelope"></i></a>
                </li>
            </ul>
        </div>
    </nav>
</body>
</html>
