<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 200vh;
            background-color: #c2c2c2;
        }

        i{
            display: block;
            font-size: 1.3rem;
        }

        nav{
            position: fixed;
            top: 0;
            z-index: 999;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            /* overflow: hidden; */
            animation: colorBar linear;
            animation-timeline: scroll();
            animation-range: 90px;

            .nav-container{
                width: 90%;
                height: 60px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;

                .logo{
                    position: relative;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    /* overflow: hidden; */

                    .text, .icon{
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%,-50%);
                    }

                    .icon{
                        /* top: 80px; */
                        transform: translateY(40px) scale(0);
                        animation: icon linear;
                        animation-timeline: scroll();
                        /* animation-range: 80px; */
                    }

                    .text{
                        animation: textUp linear;
                        animation-timeline: scroll();
                    }
                }

                ul{
                    list-style-type: none;
                    display: flex;
                    gap: 1.6rem;

                    li{
                        display: grid;
                        grid-template-columns: 1fr;
                        justify-content: center;
                        align-items: center;
                        padding: 12px 18px;
                        text-align: center;
                        border: 1px solid red;

                        span{
                            grid-area: 1/1;
                        }

                        .icon{
                            position: absolute;
                            transform: translateY(60px);
                        }
                    }

                    li a{
                        display: block;
                        color: white;
                        animation: colorBar linear;
                        animation-timeline: scroll();
                        animation-range: 90px;
                    }
                }
            }
        }

        @keyframes colorBar{
            from{
                background-color: black;
                color: white;
            }
            to{
                background-color: white;
                color: black;
            }
        }

        @keyframes icon{
            from{
                transform: translateY(40px) scale(0);
            }
            to{
                transform: translateY(-5px) scale(1);
            }
        }

        @keyframes textUp{
            to{
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <span class="text">Apple</span>
                <span class="icon"><i class="fa-brands fa-apple"></i></span>
            </div>

            <ul>
                <li>
                    <span class="text">Home</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-house"></i></a></span>
                </li>

                <li>
                    <span class="text">Video</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-video"></i></a></span>
                </li>

                <li>
                    <span class="text">Photos</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-photo-film"></i></a></span>
                </li>

                <li>
                    <span class="text">Team</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-user-group"></i></a></span>
                </li>

                <li>
                    <span class="text">Contact</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-envelope"></i></a></span>
                </li>
            </ul>
        </div>
    </nav>
</body>
</html>
