<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 200vh;
        }

        nav{
            position: fixed;
            top: 0;
            left: 0;
            background-color: #f3f3f3;
            width: 100%;
            animation: nav-cor linear forwards;
            animation-timeline: scroll();

            .nav-container{
                width: 90%;
                height: 90px;
                /* background-color: aqua; */
                margin: 0 auto;

                ul{
                    height: 100%;
                    list-style-type: none;
                    display: flex;
                    align-items: center;
                    justify-content: flex-end;
                    gap: 1.5rem;

                    li:first-child{
                        margin-right: auto;
                    }

                    li{
                        /* background-color: aliceblue; */
                        /* position: relative; */
                        height: 100%;
                        padding: 0 18px;
                        display: grid;
                        grid-template-columns: 1fr;
                        place-items: center;

                        span{
                            grid-area: 1/1;
                        }

                        a{
                            display: block;
                            color: white;
                            font-size: 1.3rem;
                            font-weight: bold;
                        }

                        .text{
                            font-size: 1.3rem;
                            transform: scale(1);
                            animation: text linear forwards;
                            animation-timeline: scroll();
                        }

                        .icon{
                            transform: scale(0);
                            animation: icon linear forwards;
                            animation-timeline: scroll();
                        }
                    }
                }
            }
        }

        @keyframes nav-cor{
            to{background-color: #000;}
        }

        @keyframes text{
            to{transform: scale(0);}
        }

        @keyframes icon{
            to{transform: scale(1);}
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <ul>
                <li>
                    <span class="text">Apple</span>
                    <span class="icon"><a href="#"><i class="fa-brands fa-apple"></i></a></span>
                </li>

                <li>
                    <span class="text">Home</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-house"></i></a></span>
                </li>

                <li>
                    <span class="text">Video</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-video"></i></a></span>
                </li>

                <li>
                    <span class="text">Photos</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-photo-film"></i></a></span>
                </li>

                <li>
                    <span class="text">Team</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-user-group"></i></a></span>
                </li>

                <li>
                    <span class="text">Contact</span>
                    <span class="icon"><a href="#"><i class="fa-solid fa-envelope"></i></a></span>
                </li>
            </ul>
        </div>
    </nav>
</body>
</html>
