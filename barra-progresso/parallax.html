<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito parallax</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 300vh;
            overflow-x: hidden;
        }

        .box{
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            display: grid;
            place-content: center;

            animation: parallax linear both;
            animation-timeline: view();
            animation-range: entry 0% cover 40%;
        }

        @keyframes parallax{
            from{
                transform: translateY(0px);
                opacity: .5;
            }
            to{
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="box" style="--bg-color: #ff7f50;">01</div>
    <div class="box" style="--bg-color: #5c50ff;">02</div>
    <div class="box" style="--bg-color: #ff50b0;">03</div>
</body>
</html>
