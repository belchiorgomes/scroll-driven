<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 — Barra de progresso do scroll</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 200vh;
        }

        /* .progress{
            position: fixed;
            top: 0;

            background-color: red;
            width: 0%;

            animation: progress linear;
            animation-timeline: scroll();

        @keyframes progress{
            from{width: 0%;}
            to{width: 100%;}
        } */

        .progress{
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            width: 100%;
            height: 5px;
            background-color: coral;
            animation: scroll linear;
            animation-timeline: scroll();
        }

        @keyframes scroll{
            to{transform: translateX(-50%) scaleX(1);}
        }

        header{
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            min-height: 100vh;
            display: grid;
            place-content: center;
        }
    </style>
</head>
<body>
    <div class="progress"></div>
    <header>
        <h1>Exemplo 1 — Barra de progresso do scroll</h1>
    </header>
</body>
</html>
