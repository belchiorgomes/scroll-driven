<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1 — Barra de progresso do scroll</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 200vh;
        }

        .progress{
            position: fixed;
            top: 0;
            right: 0;
            width: 5px;
            height: 100vh;
            transform: scaleY(0);
            transform-origin: bottom;
            background-color: coral;
            animation: scroll linear;
            animation-timeline: scroll();
        }

        @keyframes scroll{
            to{transform: scaleY(1);}
        }
    </style>
</head>
<body>
    <div class="progress"></div>
</body>
</html>
