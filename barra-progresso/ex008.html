<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .banner{
            height: 100vh;
            position: relative;
            overflow: hidden;

            .product{
                position: absolute;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                width: 400px;
                height: 400px;
                z-index: 1;

                .soda{
                    background: url(img/img04.png), url(img/img05.jpg);
                    background-repeat: no-repeat, no-repeat;
                    background-size: auto 100%;
                    width: 600px;
                    /* height: 300px; */
                    aspect-ratio: 16 / 9;
                    background-blend-mode: multiply;
                    mask-image: url(img/img04.png);
                    mask-size: auto 100%;
                }
            }
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="product">
            <div class="soda"></div>
        </div>
    </div>
</body>
</html>
