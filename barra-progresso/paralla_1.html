<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            width: 100%;
            height: 300vh;
            background-color: antiquewhite;

            .container{
                width: 100%;
                height: 100vh;
                position: sticky;
                top: 0;
                left: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8rem;

                .card{
                    display: grid;
                    grid-template-columns: 1fr;

                    .box{
                        grid-area: 1 / 1;
                        width: 300px;
                        height: 400px;
                        border-radius: .8rem;
                        background-color: var(--bg-color);
                        rotate: var(--deg);
                        animation: parallax linear both;
                        animation-timeline: scroll(root);
                        animation-range: exit;
                    }

                    .box:nth-child(1){
                        animation-range: exit 0% exit 33.33%;
                    }

                    .box:nth-child(2){
                        animation-range: exit 33.33% exit 66.66%;
                    }

                    .box:nth-child(3){
                        animation-range: exit 66.66% exit 100%;
                    }
                }
            }
        }

        @keyframes parallax{
            from{
                transform: translateY(0) rotate(0deg);
            }
            to{
                transform: translateY(1000px) rotate(400deg) scale(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Efeito de scroll-driven</h1>
            <div class="card">
                <div class="box" style="--bg-color: #ff7f50; --deg: 15deg;">01</div>
                <div class="box" style="--bg-color: #50ffc5; --deg: -15deg;">02</div>
                <div class="box" style="--bg-color: #90ff50;">03</div>
            </div>
        </div>
    </header>
</body>
</html>
